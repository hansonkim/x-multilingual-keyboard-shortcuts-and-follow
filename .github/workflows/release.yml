name: Release Packages (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: node test.cjs

      - name: Build Safari Userscript & Chrome Extension packages
        run: node scripts/build-release.cjs

      - name: Read version from manifest.json
        id: meta
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"

          write_release_notes() {
            local ver="$1"
            local out="$2"
            node -e '
              const fs = require("node:fs");
              const ver = process.argv[1];
              const out = process.argv[2];
              const tag = "v" + ver;
              const md = fs.readFileSync("CHROMEWEBSTORE.md", "utf8");
              let changes = "";
              for (const line of md.split(/\r?\n/)) {
                const m = line.match(/^\|\s*([0-9]+\.[0-9]+\.[0-9]+)\s*\|\s*([0-9-]+)\s*\|\s*(.+?)\s*\|\s*([^|]+?)\s*\|$/);
                if (m && m[1] === ver) {
                  changes = m[3].trim();
                  break;
                }
              }
              const whatsChanged = changes ? `\n### What\x27s Changed\n- ${changes}\n` : "";
              const notes = [
                `## X Multilingual Keyboard Shortcuts & Follow ${tag}`,
                whatsChanged,
                "### Safari (macOS / iOS) — Userscript",
                "1. Install a Userscript extension for Safari such as [Userscripts](https://apps.apple.com/app/userscripts/id1463298887) (free, open-source) or [Stay](https://apps.apple.com/app/stay-for-safari/id1591620171) / Tampermonkey.",
                "2. Download **`x-multilingual-keyboard-shortcuts-and-follow.user.js`** (or `x-multilingual-keyboard-shortcuts-and-follow-safari-userscript.zip`) from the Assets below and add it to your Userscripts directory.",
                "3. Open `https://x.com` in Safari — all multilingual shortcuts (`?`), `F` Follow/Unfollow, `Shift+F` Follow Filter on `/following`, `/followers`, and `/verified_followers`, `Y/N` confirmation modals, `1`–`9` home tab switching, and `G V/W/O` tab navigation work immediately.",
                "\n### Chrome / Edge / Brave / Arc",
                "- [Install from Chrome Web Store](https://chromewebstore.google.com/detail/helbbdgikebbpbjjejmkkappejlhaglf)",
                "- Or download **`x-multilingual-keyboard-shortcuts-and-follow-chrome.zip`**, unzip, and load unpacked at `chrome://extensions/`."
              ].filter(Boolean).join("\n");
              fs.writeFileSync(out, notes + "\n", "utf8");
            ' "$ver" "$out"
          }

          NOTES_FILE="$(mktemp)"
          write_release_notes "$VERSION" "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/x-multilingual-keyboard-shortcuts-and-follow.user.js \
              dist/x-multilingual-keyboard-shortcuts-and-follow-safari-userscript.zip \
              dist/x-multilingual-keyboard-shortcuts-and-follow-chrome.zip \
              --clobber
            gh release edit "$TAG" --title "X Multilingual Keyboard Shortcuts & Follow ${TAG}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              dist/x-multilingual-keyboard-shortcuts-and-follow.user.js \
              dist/x-multilingual-keyboard-shortcuts-and-follow-safari-userscript.zip \
              dist/x-multilingual-keyboard-shortcuts-and-follow-chrome.zip \
              --target main \
              --title "X Multilingual Keyboard Shortcuts & Follow ${TAG}" \
              --notes-file "$NOTES_FILE"
          fi

          # Backfill release notes for any existing releases missing "What's Changed"
          for EXISTING_TAG in $(gh release list --limit 30 --json tagName -q '.[].tagName'); do
            [ "$EXISTING_TAG" = "$TAG" ] && continue
            EXISTING_VER="${EXISTING_TAG#v}"
            EXISTING_BODY="$(gh release view "$EXISTING_TAG" --json body -q '.body')"
            if ! printf '%s' "$EXISTING_BODY" | grep -q "### What's Changed"; then
              write_release_notes "$EXISTING_VER" "$NOTES_FILE"
              gh release edit "$EXISTING_TAG" --title "X Multilingual Keyboard Shortcuts & Follow ${EXISTING_TAG}" --notes-file "$NOTES_FILE"
            fi
          done
          rm -f "$NOTES_FILE"

      - name: Authenticate to Google Cloud (Chrome Web Store API)
        id: cws_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/886328069598/locations/global/workloadIdentityPools/github/providers/github
          service_account: cws-publisher@mermaid-peek-cd.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload to Chrome Web Store (CWS API v2)
        env:
          ACCESS_TOKEN: ${{ steps.cws_auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID || '0ad8e2f8-f351-4bef-ae4c-32635ae702cb' }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID || 'helbbdgikebbpbjjejmkkappejlhaglf' }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to obtain Chrome Web Store OAuth access token."
            exit 1
          fi

          UPLOAD_RES=$(curl -sS -f -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @dist/x-multilingual-keyboard-shortcuts-and-follow-chrome.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:upload")
          echo "$UPLOAD_RES"

          STATE=$(printf '%s' "$UPLOAD_RES" | jq -r '.uploadState')
          for _ in $(seq 1 30); do
            case "$STATE" in
              *IN_PROGRESS*)
                sleep 5
                STATUS_RES=$(curl -sS -f \
                  -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                  "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus")
                STATE=$(printf '%s' "$STATUS_RES" | jq -r '.lastAsyncUploadState')
                ;;
              *)
                break
                ;;
            esac
          done

          if [ "$STATE" != "SUCCEEDED" ]; then
            echo "::error::Chrome Web Store draft upload failed (uploadState=${STATE})."
            exit 1
          fi

          CWS_STATUS=$(node -e '
            const fs = require("node:fs");
            const ver = process.argv[1];
            const md = fs.readFileSync("CHROMEWEBSTORE.md", "utf8");
            for (const line of md.split(/\r?\n/)) {
              const m = line.match(/^\|\s*([0-9]+\.[0-9]+\.[0-9]+)\s*\|\s*([0-9-]+)\s*\|\s*(.+?)\s*\|\s*([^|]+?)\s*\|$/);
              if (m && m[1] === ver) {
                process.stdout.write(m[4].trim());
                break;
              }
            }
          ' "$VERSION")

          if [ "$CWS_STATUS" = "Submitted" ]; then
            curl -sS -f -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:publish"
          else
            echo "Uploaded v${VERSION} to Chrome Web Store draft (CHROMEWEBSTORE.md Status=${CWS_STATUS:-Draft})."
          fi
